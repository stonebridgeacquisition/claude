name: Daily AI Post to Skool

on:
  schedule:
    - cron: '0 18 * * *'   # 6 PM UTC daily
  workflow_dispatch:         # allows manual trigger from GitHub UI

jobs:
  post:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SKOOL_EMAIL: ${{ secrets.SKOOL_EMAIL }}
      SKOOL_PASSWORD: ${{ secrets.SKOOL_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install google-generativeai playwright python-dotenv

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Run daily AI post workflow
        run: python tools/run_daily_ai_post.py
